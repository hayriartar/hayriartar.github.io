---
layout: default
---

<header class="post-header{% if page.categories contains 'journal' %} journal-header{% endif %}">
<h1 class="post-heading">{{ page.title }}</h1>
<span class="post-date"> {{ page.date | date: "-%B'%y" }} </span>
</header>

{% include backhome.html %}
 
<article class="post-content post-only"> {{ content }} </article>

<nav class="post-navigation">
<div class="nav-left">
  <p class="label">Previous</p>
  {% if page.previous %} <a class="prev-post" href="{{ page.previous.url }}"> {{ page.previous.title }}</a> {% endif %}
</div>
</nav>
