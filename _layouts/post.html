---
layout: default
---

    <header>
        <h1>{{ page.title }}</h1>
    </header>

    <article class="post-content">
    {{ content }}
    <p class="post-custom-date">-{{ page.date | date: "%B" }} '{{ page.date | date: "%y" }}-</p>
</article>

<style>
    .post-custom-date {
        margin-top: 1.6em;
        
    }
</style>


<nav class="back-nav">
    <div class="back-link-container">
        <a href="{{ '/' | relative_url }}" class="back-link">
            <span class="back-arrow">←</span> 
        </a>
    </div>
</nav>
